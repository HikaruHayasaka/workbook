{d:3,q:"Microsoft Graph \u304C Copilot \u306B\u679C\u305F\u3059\u5F79\u5272\u3068\u3057\u3066\u6B63\u3057\u3044\u3082\u306E\u306F\u3069\u308C\u304B\u3002",c:["\u30E1\u30FC\u30EB\u30FB\u30D5\u30A1\u30A4\u30EB\u30FB\u4F1A\u8B70\u30FB\u30C1\u30E3\u30C3\u30C8\u306A\u3069\u3001\u30E6\u30FC\u30B6\u30FC\u304C\u898B\u3089\u308C\u308B\u7D44\u7E54\u30C7\u30FC\u30BF\u3078\u306E\u5165\u53E3\u306B\u306A\u308B","\u4ED6\u793E\u30C6\u30CA\u30F3\u30C8\u306E\u30C7\u30FC\u30BF\u3092\u53D6\u308A\u8FBC\u3080","Copilot \u306E\u56DE\u7B54\u901F\u5EA6\u3092\u4E0A\u3052\u308B","\u30A4\u30F3\u30BF\u30FC\u30CD\u30C3\u30C8\u306E\u307F\u3092\u691C\u7D22\u3059\u308B"],e:"Copilot \u306F Graph \u3092\u901A\u3058\u3066\u3001\u6A29\u9650\u5185\u306E\u696D\u52D9\u30B3\u30F3\u30C6\u30AD\u30B9\u30C8\u3092\u53D6\u5F97\u3057\u3066\u56DE\u7B54\u3092\u7D44\u307F\u7ACB\u3066\u307E\u3059\u3002"}
];

const DN={1:"\u30C9\u30E1\u30A4\u30F31",2:"\u30C9\u30E1\u30A4\u30F32",3:"\u30C9\u30E1\u30A4\u30F33"};
const KEY="ab900_history_v1";
const $=id=>document.getElementById(id);
let set=[],i=0,correct=0,missed=[],scopeLabel="";

function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function loadHist(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return [];}}
function saveHist(h){try{localStorage.setItem(KEY,JSON.stringify(h));}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderHist(){
  const h=loadHist();
  if(!h.length){$("history").innerHTML='<div class="sub" style="margin:0">\u307E\u3060\u8A18\u9332\u306F\u3042\u308A\u307E\u305B\u3093\u3002</div>';return;}
  const avg=Math.round(h.reduce((s,r)=>s+r.c/r.n,0)/h.length*100);
  let t='<div class="sub" style="margin:0 0 8px">\u53D7\u9A13\u56DE\u6570 '+h.length+' \u56DE \uFF0F \u5E73\u5747\u6B63\u89E3\u7387 '+avg+'%</div><table><tr><th>\u65E5\u6642</th><th>\u7BC4\u56F2</th><th class="num">\u6B63\u89E3</th><th class="num">\u6B63\u89E3\u7387</th></tr>';
  h.slice().reverse().slice(0,30).forEach(r=>{t+='<tr><td>'+r.t+'</td><td>'+esc(r.s)+'</td><td class="num">'+r.c+'/'+r.n+'</td><td class="num">'+Math.round(r.c/r.n*100)+'%</td></tr>';});
  $("history").innerHTML=t+'</table>';
}

function show(id){["start","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}

function begin(list,label){
  set=shuffle(list).map(q=>({...q,opts:shuffle(q.c)}));
  i=0;correct=0;missed=[];scopeLabel=label;show("quiz");render();
}

function render(){
  const q=set[i];
  $("pos").textContent=(i+1)+" / "+set.length+"\u554F";
  $("tag").textContent=DN[q.d];
  $("prog").style.width=(i/set.length*100)+"%";
  $("qtext").textContent=q.q;
  $("fb").innerHTML="";$("next").classList.add("hidden");
  const box=$("opts");box.innerHTML="";
  q.opts.forEach((o,k)=>{
    const b=document.createElement("button");b.className="opt";
    b.textContent=String.fromCharCode(65+k)+". "+o;
    b.onclick=()=>answer(b,o);box.appendChild(b);
  });
}

function answer(btn,choice){
  const q=set[i],ans=q.c[0],ok=choice===ans;
  [...$("opts").children].forEach((b,k)=>{b.disabled=true;if(q.opts[k]===ans)b.classList.add("correct");});
  if(ok)correct++;else{btn.classList.add("wrong");missed.push(q);}
  $("fb").innerHTML='<div class="feedback '+(ok?"ok":"ng")+'"><div class="verdict">'+(ok?"\u25CB \u6B63\u89E3":"\u00D7 \u4E0D\u6B63\u89E3")+'</div><div>\u6B63\u89E3\uFF1A'+esc(ans)+'</div><div style="margin-top:4px">'+esc(q.e)+'</div></div>';
  const n=$("next");n.textContent=i===set.length-1?"\u7D50\u679C\u3092\u898B\u308B":"\u6B21\u3078";n.classList.remove("hidden");n.focus();
}

function finish(){
  const n=set.length,rate=Math.round(correct/n*100);
  const d=new Date(),p=x=>String(x).padStart(2,"0");
  const h=loadHist();h.push({t:d.getFullYear()+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()),s:scopeLabel,c:correct,n:n});saveHist(h);
  $("rate").textContent=rate+"%";
  $("detail").textContent=n+"\u554F\u4E2D "+correct+"\u554F\u6B63\u89E3\uFF08"+scopeLabel+"\uFF09";
  $("retry").classList.toggle("hidden",!missed.length);
  $("missbox").classList.toggle("hidden",!missed.length);
  $("misses").innerHTML=missed.map(q=>'<div class="miss"><b>'+esc(q.q)+'</b>\u6B63\u89E3\uFF1A'+esc(q.c[0])+'</div>').join("");
  show("result");
}

$("go").onclick=()=>{
  const dom=+document.querySelector('input[name=dom]:checked').value;
  const num=+document.querySelector('input[name=num]:checked').value;
  let list=dom?Q.filter(q=>q.d===dom):Q;
  list=shuffle(list);if(num)list=list.slice(0,num);
  begin(list,(dom?DN[dom]:"\u5168\u7BC4\u56F2")+(num?" "+num+"\u554F":" \u5168\u554F"));
};
$("next").onclick=()=>{i++;if(i<set.length)render();else finish();};
$("quit").onclick=()=>{if(confirm("\u4E2D\u65AD\u3057\u3066\u30C8\u30C3\u30D7\u306B\u623B\u308A\u307E\u3059\u304B\uFF1F\uFF08\u8A18\u9332\u306F\u6B8B\u308A\u307E\u305B\u3093\uFF09")){renderHist();show("start");}};
$("retry").onclick=()=>begin(missed,"\u9593\u9055\u3048\u305F\u554F\u984C\u306E\u518D\u6311\u6226");
$("home").onclick=()=>{renderHist();show("start");};
$("clear").onclick=()=>{if(confirm("\u8A18\u9332\u3092\u3059\u3079\u3066\u6D88\u53BB\u3057\u307E\u3059\u304B\uFF1F")){saveHist([]);renderHist();}};
renderHist();
</script>
</body>
</html>
